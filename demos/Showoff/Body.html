<fieldset>
  <legend>Showoff</legend>
  <fieldset style="display: flex; flex-direction: column; row-gap: 15px">
    <legend>Partner</legend>
    <dialog id="PartnerDevices"></dialog>
    <fieldset>
      <legend>Device</legend>
      <div style="display: flex; flex-direction: column; gap: 5px">
        <input
          id="PartnerDevice"
          value="{}"
          placeholder="Device"
          class="clearable"
          style="width: stretch; width: -moz-available" />
        <div style="display: flex; justify-content: space-around">
          <button xdh:onevent="PartnerConnect">Connect</button>
          <button xdh:onevent="PartnerSelect">Select</button>
        </div>
      </div>
    </fieldset>
    <span
      style="
        display: grid;
        grid-template-columns: auto auto auto;
        justify-content: space-around;
        grid-row-gap: 8px;
      ">
      <button xdh:onevent="PartnerBuzzer">Buzzer</button>
      <button xdh:onevent="PartnerRing">Ring</button>
      <button xdh:onevent="PartnerPanel">Panel</button>
      <button xdh:onevent="PartnerScreenGeo">Screen G</button>
      <button xdh:onevent="PartnerScreenMov">Screen M</button>
      <button xdh:onevent="PartnerServos">Servos</button>
      <button xdh:onevent="PartnerIndy">Indy</button>
      <button xdh:onevent="PartnerMatrix">Matrix</button>
      <button xdh:onevent="PartnerListen">Listen</button>
      <input id="PartnerColors" type="hidden" />
    </span>
    <fieldset
      style="display: flex; justify-content: space-between"
      id="PartnerLength"
      xdh:radio="PartnerLength">
      <legend>Duration</legend>
      <label>
        <input type="radio" name="PartnerLength" value="0" checked />
        <span>Short</span>
      </label>
      <label>
        <input type="radio" name="PartnerLength" value="1" />
        <span>Middle</span>
      </label>
      <label>
        <input type="radio" name="PartnerLength" value="2" />
        <span>Long</span>
      </label>
    </fieldset>
    <fieldset style="display: flex; justify-content: space-around">
      <legend>Orientation</legend>
      <input type="checkbox" id="PartnerOrientation" />
      <span>
        <span>Z: </span>
        <output
          style="
            display: inline-block;
            font-family: monospace;
            width: 4ch;
            font-size: larger;
          "
          id="PartnerOrientationZ"></output>
      </span>
      <span>
        <span>X: </span>
        <output
          style="
            display: inline-block;
            font-family: monospace;
            width: 4ch;
            font-size: larger;
          "
          id="PartnerOrientationX"></output>
      </span>
      <span>
        <span>Y: </span>
        <output
          style="
            display: inline-block;
            font-family: monospace;
            width: 4ch;
            font-size: larger;
          "
          id="PartnerOrientationY"></output>
      </span>
    </fieldset>
  </fieldset>
  <fieldset>
    <legend>Show</legend>
    <dialog id="ShowDevices"></dialog>
    <fieldset style="display: flex; justify-content: space-around; gap: 5px">
      <legend>Devices</legend>
      <div style="display: flex; flex-direction: column; gap: 5px">
        <input
          id="ShowLeftDevice"
          value="{}"
          class="clearable"
          placeholder="Left device" />
        <input
          id="ShowMiddleDevice"
          value="{}"
          class="clearable"
          placeholder="Middle device" />
        <input
          id="ShowRightDevice"
          value="{}"
          class="clearable"
          placeholder="Right device" />
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          justify-content: space-around;
        ">
        <button xdh:onevent="ShowConnect">Connect</button>
        <button xdh:onevent="ShowSelect">Select</button>
      </div>
    </fieldset>
    <div style="display: flex; width: 100%; justify-content: space-around">
      <fieldset
        style="
          display: flex;
          column-gap: 5px;
          width: 100%;
          justify-content: space-between;
        ">
        <legend>Synchro.</legend>
        <button xdh:onevent="ShowSyncTest">Test</button>
        <button xdh:onevent="ShowSyncAdjust">Adjust</button>
      </fieldset>
      <fieldset
        style="
          display: flex;
          column-gap: 5px;
          width: 100%;
          justify-content: space-between;
        ">
        <legend>Control</legend>
        <button xdh:onevent="ShowDisableControl">
          <svg
            width="1em"
            height="1em"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </button>
        <button xdh:onevent="ShowStop">
          <svg width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor">
            <rect x="5" y="5" width="14" height="14" rx="1.5"></rect>
          </svg>
        </button>
        <button id="ShowSuspendRestart" xdh:onevent="ShowSuspendRestart">
          <svg width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="3,5 13,12 3,19"></polygon>
            <rect x="15" y="5" width="2.5" height="14" rx="0.5"></rect>
            <rect x="19.5" y="5" width="2.5" height="14" rx="0.5"></rect>
          </svg>
        </button>
      </fieldset>
    </div>
    <div
      style="
        display: flex;
        width: 100%;
        justify-content: space-around;
        margin-top: 8px;
      ">
      <select id="Show">
        <optgroup label="Misc.">
          <option value="Indy">Indy</option>
          <option value="Bouncing">Bouncing</option>
          <option value="Colors">Colors</option>
          <option value="Pink">Pink</option>
          <option value="Life">Life</option>
          <option value="Canon">Canon</option>
        </optgroup>
        <optgroup label="Trios" id="ShowTrios"></optgroup>
      </select>
      <label>
        <span>⌛:</span>
        <input id="ShowCountdown" type="checkbox" checked />
      </label>
      <button xdh:onevent="ShowPlay">Play</button>
    </div>
  </fieldset>
  <fieldset>
    <legend>QR Codes</legend>
    <select id="QRCodesList" xdh:onevent="QRCodesSelect"></select>
    <input id="QRCodesText" xdh:onevent="QRCodesDisplay" type="text" />
    <button xdh:onevent="QRCodesDisplay">Display</button>
  </fieldset>
</fieldset>
